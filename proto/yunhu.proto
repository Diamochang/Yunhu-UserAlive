// ==================== 已读消息相关 ====================

// 已读消息请求
message ReadMessageRequest {
  string seq = 1;
  string cmd = 2;
  ReadData data = 3;
  
  message ReadData {
    string chatId = 1;
    int32 chatType = 2;
    string lastMsgId = 3;
  }
}

// ==================== 聊天列表相关 ====================

// 获取聊天列表请求
message GetChatListRequest {
  string seq = 1;
  string cmd = 2;
  ChatListData data = 3;
  
  message ChatListData {
    int32 page = 1;
    int32 pageSize = 2;
  }
}

// ==================== 撤回消息相关 ====================

// 撤回消息请求
message RecallMessageRequest {
  string msg_id = 2;       // 信息ID
  string chat_id = 3;      // 信息所属对象ID
  uint64 chat_type = 4;    // 信息所属对象类型, 1-用户 2-群聊 3-机器人
}

// 撤回消息响应
message RecallMessageResponse {
  Status status = 1;
}

// 批量撤回消息请求
message BatchRecallMessageRequest {
  repeated string msg_id = 2;  // 信息ID
  string chat_id = 3;          // 信息所属对象ID
  uint64 chat_type = 4;        // 信息所属对象类型, 1-用户 2-群聊 3-机器人
}

// 批量撤回消息响应
message BatchRecallMessageResponse {
  Status status = 1;
}

// ==================== 按钮事件相关 ====================

// 按钮点击事件请求
message ButtonReportRequest {
  string msg_id = 2;         // 信息ID
  uint64 chat_type = 3;      // 对象类型, 1-用户 2-群聊 3-机器人
  string chat_id = 4;        // 对象ID
  string user_id = 5;        // 按钮事件发送者ID
  string button_value = 6;   // 欲点击按钮的值
}

// 按钮事件响应
message ButtonReportResponse {
  Status status = 1;
}

// ==================== 流式消息相关 ====================

// 流式消息
message StreamMessage {
  INFO info = 1;
  Data data = 2;
  
  message Data {
    string any = 1;
    StreamMsg msg = 2;
    
    message StreamMsg {
      string msg_id = 1;
      string recv_id = 2;
      string chat_id = 3;      // 似乎是会话ID
      string content = 4;      // 消息内容
    }
  }
}

// ==================== 笔记同步相关 ====================

// 输入信息同步(发送)
message InputInfo {
  string seq = 1;
  string cmd = 2;
  InputData data = 3;
  
  message InputData {
    string chatId = 1;
    string input = 2;
    string deviceId = 3;
  }
}

// 草稿同步(接收)
message DraftInput {
  INFO info = 1;
  Data data = 2;
  
  message Data {
    string any = 1;
    Draft draft = 2;
    
    message Draft {
      string chat_id = 1;      // 对象ID
      string input = 2;        // 草稿内容
    }
  }
}

// ==================== 超级文件分享相关 ====================

// 超级文件分享推送
message FileSendMessage {
  INFO info = 1;
  Data data = 2;
  
  message Data {
    string any = 1;
    Sender sender = 2;
    
    message Sender {
      string send_user_id = 1;      // 分享者用户ID
      string user_id = 2;           // 接收者用户ID
      uint64 temp_code = 3;         // 未知
      string send_type = 4;         // 分享类别区分文本
      string data = 5;              // 经过转义后的json格式发送数据
      string send_deviceId = 6;     // 发送者设备唯一标识符
    }
  }
}

// ==================== 邀请消息相关 ====================

// 邀请申请推送
message InviteApply {
  INFO info = 1;
}

// ==================== 编辑消息推送相关 ====================

// 编辑消息推送
message EditMessagePush {
  INFO info = 1;
  Data data = 2;
  
  message Data {
    string any = 1;
    Msg msg = 2;
  }
  
  message Msg {
    string msg_id = 1;
    string recv_id = 3;
    string chat_id = 4;
    Content content = 6;
    uint64 content_type = 7;
    string quote_msg_id = 11;
    uint64 edit_time = 14;         // 编辑时间
    
    message Content {
      string text = 1;
      string buttons = 2;
      string quote_msg_text = 8;
    }
  }
}

// ==================== 通用INFO结构 ====================

// 通用INFO结构(用于WebSocket)
message INFO {
  string seq = 1;    // 请求标识码
  string cmd = 2;    // 操作类型
}
