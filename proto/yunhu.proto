syntax = "proto3";

package yunhu;

// ==================== 基础消息结构 ====================

// 状态信息(所有响应通用)
message Status {
  uint64 number = 1; // 不知道干啥的,可能是请求ID
  uint64 code = 2;   // 状态码,1为正常
  string msg = 3;    // 返回消息
}

// ==================== WebSocket消息 ====================

// WebSocket登录消息
message WSLogin {
  string seq = 1;
  string cmd = 2;
  LoginData data = 3;
  
  message LoginData {
    string userId = 1;
    string token = 2;
    string platform = 3;
    string deviceId = 4;
  }
}

// WebSocket心跳消息
message WSHeartbeat {
  string seq = 1;
  string cmd = 2;
}

// WebSocket心跳响应
message WSHeartbeatAck {
  Data data = 1;
  
  message Data {
    string id = 1;
    string cmd = 2;
  }
}

// WebSocket退出登录消息
message WSLogout {
  string seq = 1;
  string cmd = 2;
  LogoutData data = 3;
  
  message LogoutData {
    string deviceId = 1;
  }
}

// ==================== 发送消息相关 ====================

// 发送消息请求
message SendMessageRequest {
  string msg_id = 2;           // 信息ID
  string chat_id = 3;          // 欲发送到的信息对象
  uint64 chat_type = 4;        // 欲发送到的信息对象的类别，1-用户，2-群聊，3-机器人
  Data data = 5;               // 消息数据
  uint64 content_type = 6;     // 信息类别，1-文本，2-图片，3-markdown，4-文件，5-表单，6-文章，7-表情，8-html，11-语音，13-语音通话
  uint64 command_id = 7;       // 所使用命令ID
  string quote_msg_id = 8;     // 引用信息ID
  Media media = 9;             // 媒体信息
  
  // 消息数据
  message Data {
    string text = 1;                    // 信息文本
    string buttons = 2;                 // 按钮
    string file_name = 4;               // 欲发送文件名称
    string file_key = 5;                // 欲发送文件key
    repeated string mentioned_id = 6;   // @用户ID,可以填写多个
    string form = 7;                    // 表单消息
    string quote_msg_text = 8;          // 引用信息文本
    string image = 9;                   // 欲发送图片key/url(expression/abcdef.jpg)
    string post_id = 10;                // 文章ID
    string post_title = 11;             // 文章标题
    string post_content = 12;           // 文章内容
    string post_type = 13;              // 文章类型:1-文本,2-Markdown
    string expression_id = 15;          // 个人表情ID(不知道为啥为STR)
    string quote_image_url = 16;        // 引用图片直链,https://...
    string quote_image_name = 17;       // 引用图片文件名称
    uint64 file_size = 18;              // 欲发送文件大小
    string video = 19;                  // 欲发送视频key/url(123.mp4)
    string audio = 21;                  // 语音key/url(123.m4a)
    uint64 audio_time = 22;             // 语音秒数
    string quote_video_url = 23;        // 引用视频直链,https://...
    uint64 quote_video_time = 24;       // 引用视频时长
    uint64 sticker_item_id = 25;        // 表情ID
    uint64 sticker_pack_id = 26;        // 表情包ID
    string room_name = 29;              // 语音房间发送显示信息的文本
  }
  
  // 媒体信息(图片/音频/视频)
  message Media {
    string file_key = 1;      // 发送对象key(就是上传后七牛对象存储给你返回的file_key)
    string file_hash = 2;     // 发送对象上传返回哈希
    string file_type = 3;     // 发送对象类别，image/jpeg-图片，video/mp4-视频
    uint64 image_height = 5;  // 图片高度
    uint64 image_width = 6;   // 图片宽度
    uint64 file_size = 7;     // 发送对象大小
    string file_key2 = 8;     // 发送对象key,和1一样,据说不写会报错
    string file_suffix = 9;   // 发送对象后缀名
  }
}

// 发送消息响应
message SendMessageResponse {
  Status status = 1;
}

// ==================== 编辑消息相关 ====================

// 编辑消息请求
message EditMessageRequest {
  string msg_id = 2;           // 要编辑的消息ID
  string chat_id = 3;          // 消息所属聊天对象的ID
  int32 chat_type = 4;         // 消息所属聊天对象的类型,1-用户 2-群组 3-机器人
  Content content = 5;         // 消息内容
  uint64 content_type = 6;     // 信息类别，1-文本，3-markdown，8-html
  string quote_msg_id = 8;     // 引用信息ID
  
  message Content {
    string text = 1;           // 文本
    string buttons = 2;        // 按钮
    string quote_msg_text = 8; // 引用消息文字
  }
}

// 编辑消息响应
message EditMessageResponse {
  Status status = 1;
}

// ==================== 接收消息相关 ====================

// 推送消息(WebSocket接收)
message PushMessage {
  Message msg = 1;
  
  message Message {
    string msg_id = 1;            // 消息ID
    Sender sender = 2;            // 发送者信息
    string recv_id = 3;           // 接收者ID
    string chat_id = 4;           // 会话的ID
    uint64 chat_type = 5;         // 会话的类型,1-用户 2-群组 3-机器人
    Content content = 6;          // 消息内容
    uint64 content_type = 7;      // 消息类型
    uint64 timestamp = 8;         // 时间戳(毫秒)
    Cmd cmd = 9;                  // 指令信息
    uint64 delete_timestamp = 10; // 撤回消息时间
    string quote_msg_id = 11;     // 引用消息ID
    uint64 msg_seq = 12;          // 消息序列
    
    // 发送者信息
    message Sender {
      string chat_id = 1;         // 发送者ID
      uint64 chat_type = 2;       // 发送者类型
      string name = 3;            // 发送者名称
      string avatar_url = 4;      // 头像URL
      repeated string tag_old = 6; // 标签(旧版显示)
      repeated Tag tag = 7;       // 标签
      
      message Tag {
        uint64 id = 1;            // 标签ID
        string text = 3;          // 标签文字
        string color = 4;         // 颜色(#FFFFFFFF)
      }
    }
    
    // 消息内容
    message Content {
      string text = 1;                    // 消息内容
      string buttons = 2;                 // 按钮
      string image_url = 3;               // 图像URL
      string file_name = 4;               // 文件名
      string file_url = 5;                // 文件URL
      string form = 7;                    // 表单消息
      string quote_msg_text = 8;          // 引用消息文字
      string sticker_url = 9;             // 表情URL
      string post_id = 10;                // 文章ID
      string post_title = 11;             // 文章标题
      string post_content = 12;           // 文章内容
      string post_content_type = 13;      // 文章类型
      string expression_id = 15;          // 个人表情ID
      string quote_image_url = 16;        // 引用图片直链
      string quote_image_name = 17;       // 引用图片文件名称
      uint64 file_size = 18;              // 文件/图片大小(字节)
      string video_url = 19;              // 视频URL
      string audio_url = 21;              // 语音URL
      uint64 audio_time = 22;             // 语音时长
      string quote_video_url = 23;        // 引用视频直链
      uint64 quote_video_time = 24;       // 引用视频时长
      uint64 sticker_item_id = 25;        // 表情ID
      uint64 sticker_pack_id = 26;        // 表情包ID
      string call_text = 29;              // 语音通话文字
      string call_status_text = 32;       // 语音通话状态文字
      uint64 width = 33;                  // 图片的宽度
      uint64 height = 34;                 // 图片的高度
      string tip = 37;                    // 提示信息
    }
    
    // 指令信息
    message Cmd {
      uint64 id = 1;            // 命令ID
      string name = 2;          // 命令名称
    }
  }
}

// ==================== 消息列表相关 ====================

// 按消息序列列出消息请求
message ListMessageBySeqRequest {
  uint64 msg_start = 3;    // 从第N个消息开始
  uint64 chat_type = 4;    // 对象类型, 1-用户 2-群聊 3-机器人
  string chat_id = 5;      // 对象ID
}

// 按消息序列列出消息响应
message ListMessageBySeqResponse {
  Status status = 1;
  repeated Msg msg = 2;
  uint64 msg_count = 3;    // 消息数
  
  message Msg {
    string msg_id = 1;
    Sender sender = 2;
    string direction = 3;           // 消息位置,左边/右边
    uint64 content_type = 4;
    Content content = 5;
    uint64 send_time = 6;           // 时间戳(毫秒)
    Cmd cmd = 7;                    // 指令
    uint64 msg_delete_time = 8;     // 消息撤回时间
    string quote_msg_id = 9;        // 引用消息ID
    uint64 msg_seq = 10;
    uint64 edit_time = 12;          // 最后编辑时间
    
    message Cmd {
      string name = 2;              // 指令名
      uint64 type = 4;              // 指令类型
    }
    
    message Content {
      string text = 1;
      string buttons = 2;
      string image_url = 3;
      string file_name = 4;
      string file_url = 5;
      string form = 7;
      string quote_msg_text = 8;
      string sticker_url = 9;
      string post_id = 10;
      string post_title = 11;
      string post_content = 12;
      string post_content_type = 13;
      string expression_id = 15;
      string quote_image_url = 16;
      string quote_image_name = 17;
      uint64 file_size = 18;
      string video_url = 19;
      string audio_url = 21;
      uint64 audio_time = 22;
      string quote_video_url = 23;
      uint64 quote_video_time = 24;
      uint64 sticker_item_id = 25;
      uint64 sticker_pack_id = 26;
      string call_text = 29;
      string call_status_text = 32;
      uint64 width = 33;
      uint64 height = 34;
      string tip = 37;
    }
    
    message Sender {
      string chat_id = 1;
      uint64 chat_type = 2;
      string name = 3;
      string avatar_url = 4;
      repeated string tag_old = 6;
      repeated Tag tag = 7;
      
      message Tag {
        uint64 id = 1;
        string text = 3;
        string color = 4;
      }
    }
  }
}

