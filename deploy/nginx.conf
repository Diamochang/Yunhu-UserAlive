# Nginx配置示例 - 云湖保活用户机器人
# 将此文件复制到 /etc/nginx/sites-available/yunhu-useralive
# 然后创建符号链接: ln -s /etc/nginx/sites-available/yunhu-useralive /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name yunhu.example.com;  # 修改为你的域名
    
    # 重定向到HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yunhu.example.com;  # 修改为你的域名
    
    # SSL证书配置
    ssl_certificate /etc/letsencrypt/live/yunhu.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yunhu.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 日志
    access_log /var/log/nginx/yunhu-useralive-access.log;
    error_log /var/log/nginx/yunhu-useralive-error.log;
    
    # 客户端最大上传大小
    client_max_body_size 10M;
    
    # 反向代理到Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 健康检查端点(可选:允许监控工具访问)
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_set_header Host $host;
        access_log off;  # 不记录健康检查日志
    }
    
    # Prometheus指标(建议限制访问)
    location /metrics {
        # 只允许本地访问
        allow 127.0.0.1;
        allow ::1;
        # 添加你的监控服务器IP
        # allow 192.168.1.100;
        deny all;
        
        proxy_pass http://127.0.0.1:5000/metrics;
        proxy_set_header Host $host;
    }
    
    # 静态文件(如果有)
    location /static {
        alias /opt/yunhu-useralive/web/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
