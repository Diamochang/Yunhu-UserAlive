version: '3.8'

services:
  yunhu-useralive:
    build: .
    container_name: yunhu-useralive
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MASTER_PASSWORD=${MASTER_PASSWORD}
      - ENCRYPTION_SALT=${ENCRYPTION_SALT:-production-salt-change-me}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - DATABASE_PATH=/app/data/yunhu_useralive.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - yunhu-network
    labels:
      - "top.diamochang.yunhu-useralive.description=一个功能更加完善的云湖保活软件，专为因客观因素不能连续活跃的云湖原住民设计。 "
      - "top.diamochang.yunhu-useralive.version=0.7.0"

networks:
  yunhu-network:
    driver: bridge
